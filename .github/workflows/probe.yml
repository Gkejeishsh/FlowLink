name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: sdk
        run: |
          java -version
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          ls $HOME/android-sdk/build-tools
          df -h /
      - name: gradle
        run: curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip && unzip -q g.zip && ./gradle-8.13/bin/gradle --version | head -8
